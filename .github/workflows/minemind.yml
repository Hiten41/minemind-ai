name: MineMind regression checks
on:
  push:
    paths: ['minemind/**', '.github/workflows/minemind.yml']
  pull_request:
    paths: ['minemind/**', '.github/workflows/minemind.yml']
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: minemind/backend/requirements-test.txt
      - run: pip install -r minemind/backend/requirements-test.txt
      - run: python -m pytest minemind/backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minemind/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: minemind/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
